type: object
required:
  - name
  - email
  - password
properties:
  name:
    type: string
    example: 'Olya Iarova'
    description: "User's name" 
  email:
    type: string
    format: email
    uniqueItems: true
    example: 'OlyaIarova@gmail.com'
    description: "User's email address"
  password:
    type: string
    example: 'password123'
    description: "User's password"
  createdAt:
    type: string
    format: date-time
    example: '2024-08-05T09:51:10.115+00:00'
    description: 'Timestamp when the user was created'
  updatedAt:
    type: string
    format: date-time
    example: '2024-08-05T09:51:10.115+00:00'
    description: 'Timestamp when the user was last updated'