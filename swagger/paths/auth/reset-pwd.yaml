tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: 'Reset the user password with using reset token'
security:
  - bearerAuth: []
requestBody:
  description: Reset password details
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            type: string
            example: 'v9/IYvnLBeDeNIWgEKVmdmxHE+jtk2NGMng/9g3m'
            description: "User's token"
          password:
            type: string
            example: 'password123'
            description: "User's password"
        required:
          - token
          - password
responses:
  '200':
    description: Password successfully reset
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password was successfully reset!
            data:
              type: object
  '400':
    description: Bad request
  '401':
     $ref: ..\..\components\responses\401.yaml
  '404':
    $ref: ..\..\components\responses\404.yaml