
tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of contacts of user'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: The page number for pagination
    schema:
      type: integer
    example: 1
  - in: query
    name: perPage
    description: The number of contacts per page
    schema:
      type: integer
      example: 10   
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
    description: "Field to sort the contacts by.Default value - _id"
  - in: query
    name: sortOrder
    description: "Field to sort the contacts by. Default value - asc"
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'    
  - in: query
    name: contactType
    description: "Filter contacts by type. Default value - personal"
    schema:
      type: string
      example: home
      enum: ['work', 'home', 'personal']
  - in: query
    name: isFavourite
    description: 'Shows if the contact is marked as a favorite'
    schema:
      type: boolean
      example: true
  - in: query
    name: name
    schema:
      type: string
      example: 'Olya Iarova'
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ..\..\components\schemas\contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '404':
    $ref: ..\..\components\responses\404.yaml