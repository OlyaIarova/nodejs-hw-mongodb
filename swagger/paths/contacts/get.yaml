
tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of contacts of user'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: The page number for pagination
    schema:
      type: integer
    example: 1
  - in: query
    name: perPage
    description: The number of contacts per page
    schema:
      type: integer
      example: 10   
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
    description: "Field to sort the contacts by.Default value - _id"
  - in: query
    name: sortOrder
    description: "Field to sort the contacts by. Default value - asc"
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'    
  - in: query
    name: contactType
    description: "Filter contacts by type. Default value - personal"
    schema:
      type: string
      example: home
      enum: ['work', 'home', 'personal']
  - in: query
    name: isFavourite
    description: 'Shows if the contact is marked as a favorite'
    schema:
      type: boolean
      example: true
  - in: query
    name: name
    schema:
      type: string
      example: 'Olya Iarova'
responses:
  '200':
     $ref: ..\..\components\responses\200.yaml
  '401':
    $ref: ..\..\components\responses\401.yaml