tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: 'Olya Iarova'
            description: "Contacts's name"
          phoneNumber:
            type: string
            example: '+380000000111'
            description: "Contact's phone number"
          email:  
            type: string
            example: 'OlyaIarova@gmail.com'
            description: "Contact's email"
          contactType:
             type: string
             enum: ['work', 'home', 'personal']
             default: 'personal'
             example: 'home'
             description: Filter contacts by type. Default value - personal
          isFavourite:
            type: boolean
            default: false
            example: false
            description: 'Shows if the contact is marked as a favorite'
          photo:
            type: string
            format: binary
            description: "Contact's photo"
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ..\..\components\schemas\contact.yaml
  '401':
    $ref: ..\..\components\responses\401.yaml
  '500':
    $ref: ..\..\components\responses\500.yaml